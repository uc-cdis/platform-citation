[tool.poetry]
name = "platform-citation"
version = "0.1.0"
description = "For managing and publishing all language for citing Gen3 platforms"
authors = ["CTDS UChicago <cdis@uchicago.edu>"]
license = "Apache-2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
cfgv = "^3.5.0"
charset-normalizer = "^3.4.4"
click = "^8.3.1"
colorama = "^0.4.6"
distlib = "^0.4.0"
filelock = "^3.20.3"
ghp-import = "^2.1.0"
identify = "^2.6.16"
idna = "^3.11"
importlib-metadata = "^8.7.1"
jinja2 = "^3.1.6"
markdown = "^3.10.1"
mergedeep = "^1.3.4"
mkdocs = "^1.6.1"
mkdocs-material = "^9.7.1"
mkdocs-video = "^1.5.0"
nodeenv = "^1.10.0"
pre-commit = "^4.5.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
